name: Update Data-Free Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (defaults to latest v* tag or v1.01)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify data-free repository preflight
        run: python3 scripts/preflight_data_free.py

      - name: Determine release tag and sync to HEAD
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git checkout -f "${TAG}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo 'v1.01')"
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}" 2>/dev/null || true)"

          if [ "${GITHUB_REF_TYPE:-}" != "tag" ] && [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f -a "${TAG}" -m "Release ${TAG} (${HEAD_SHA:0:7})" "${HEAD_SHA}"
            git push origin "refs/tags/${TAG}" --force
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Generate release notes
        run: |
          python3 scripts/generate_release_notes.py \
            --tag "${{ steps.meta.outputs.tag }}" \
            --out /tmp/release-notes.md

      - name: Create or update source-only GitHub release (no VPK)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          TITLE="Pokémon Emerald Voxel PS Vita ${TAG}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "${TITLE}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file /tmp/release-notes.md
          fi
